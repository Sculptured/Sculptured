[package]
name = "controld"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
model.workspace = true
rigspec.workspace = true
madl.workspace = true
serde_yaml_ng.workspace = true
host-proto.workspace = true
interpreter.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
ts-rs.workspace = true
schemars.workspace = true
serde_path_to_error = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Built with other crates, reqwest gets rustls without a crypto provider; analytics installs this one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
uuid.workspace = true
tracing.workspace = true

sha2.workspace = true
signing.workspace = true
localops.workspace = true
hex.workspace = true
sysinfo = "0.39.6"

[features]
# Test-only hooks (the `seams` module). Only this crate's own dev-dependency on itself
# enables it, so a normal or release build of sculptured carries no hook.
test-seams = []

[dev-dependencies]
controld = { path = ".", features = ["test-seams"] }
fixtures = { path = "../fixtures" }
hostd.workspace = true
drivers.workspace = true
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
async-trait.workspace = true
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true
