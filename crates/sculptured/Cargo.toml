[package]
name = "sculptured"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "sculptured"
path = "src/main.rs"

# Windows: runs `sculptured` with no console window (the logon task starts this).
[[bin]]
name = "sculptured-background"
path = "src/background.rs"

[dependencies]
controld.workspace = true
hostd.workspace = true
drivers.workspace = true
model.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
clap.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# One TLS crypto provider for the runner link and the pairing client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# A component secret is typed without echo.
rpassword = "7"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
