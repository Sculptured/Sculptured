# Live (see live.ts): rig.spec.ts copies this file into a work folder under the e2e server's HOME,
# so cwd "." is that folder. Agents a and b are real Claude Code on haiku; c never launches.
version: "0.2"
name: e2e-desktop
pods:
  - id: dev
    label: Dev
    members:
      - { id: a, agent_ref: "local:agents/a", profile: default, runtime: claude-code, model: haiku, cwd: "." }
      - { id: b, agent_ref: "local:agents/b", profile: default, runtime: claude-code, model: haiku, cwd: "." }
      - { id: c, agent_ref: "local:agents/c", profile: default, runtime: claude-code, model: haiku, cwd: "/nonexistent/sculptured-e2e/a/deliberately/very/long/working/directory/path/that/does/not/exist/anywhere/on/this/machine/so/launch/fails/with/a/long/lifecycle/reason" }
    edges:
      - { kind: delegates_to, from: a, to: b }
